[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Selección explícita para que CI sea reproducible: sin esto se aplica el set
# por defecto de la versión de ruff instalada, que cambia entre releases y
# rompe el build sin que nadie haya tocado el código.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
markers = [
    "integration: pruebas que requieren Ollama corriendo y acceso real a disco",
]
